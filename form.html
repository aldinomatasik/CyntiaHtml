<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Registrasi</title>
  <style>
    body {
      font-family: 'Times New Roman', Times, serif;
      padding: 10px;
    }
    fieldset {
      margin-bottom: 15px;
      padding: 12px 15px 15px 15px;
      border: 1px solid #777;
    }
    legend {
      font-weight: normal;
      padding: 0 5px;
    }
    table {
      border-collapse: collapse;
    }
    td {
      padding: 4px 6px;
    }
    td:first-child {
      padding-left: 0;
    }
    input[type="text"], input[type="email"], input[type="password"], input[type="url"], textarea, select {
      font-family: inherit;
    }
    .btn-group {
      margin-top: 15px;
    }
    .btn-group input {
      padding: 2px 10px;
      margin-right: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Form Registrasi</h1>

  <form action="" method="post">
    <!-- Fieldset Biodata -->
    <fieldset>
      <legend>Biodata</legend>
      <table>
        <tr>
          <td>Nama Mahasiswa</td>
          <td>:</td>
          <td><input type="text" name="nama" placeholder="Nama Anda" size="25"></td>
        </tr>
        <tr>
          <td>No Induk Mahasiswa (NIM)</td>
          <td>:</td>
          <td><input type="text" name="nim" value="123456789" size="25" readonly style="background-color: #f2f2f2;"></td>
        </tr>
        <tr>
          <td style="vertical-align: top;">Alamat Mahasiswa</td>
          <td style="vertical-align: top;">:</td>
          <td><textarea name="alamat" rows="6" cols="45" placeholder="Alamat Anda"></textarea></td>
        </tr>
        <tr>
          <td>Tanggal Lahir</td>
          <td>:</td>
          <td>
            <select name="tanggal">
              <option value="01">01</option>
              <option value="02">02</option>
              <option value="03">03</option>
              <option value="04">04</option>
              <option value="05">05</option>
              <option value="06">06</option>
              <option value="07">07</option>
              <option value="08">08</option>
              <option value="09">09</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="17">17</option>
              <option value="18">18</option>
              <option value="19">19</option>
              <option value="20">20</option>
              <option value="21">21</option>
              <option value="22">22</option>
              <option value="23">23</option>
              <option value="24">24</option>
              <option value="25">25</option>
              <option value="26">26</option>
              <option value="27">27</option>
              <option value="28">28</option>
              <option value="29">29</option>
              <option value="30">30</option>
              <option value="31">31</option>
            </select>
            <select name="bulan">
              <option value="Januari">Januari</option>
              <option value="Februari">Februari</option>
              <option value="Maret">Maret</option>
              <option value="April">April</option>
              <option value="Mei">Mei</option>
              <option value="Juni">Juni</option>
              <option value="Juli">Juli</option>
              <option value="Agustus">Agustus</option>
              <option value="September">September</option>
              <option value="Oktober">Oktober</option>
              <option value="November">November</option>
              <option value="Desember">Desember</option>
            </select>
            <select name="tahun">
              <option value="1990">1990</option>
              <option value="1991">1991</option>
              <option value="1992">1992</option>
              <option value="1993">1993</option>
              <option value="1994">1994</option>
              <option value="1995">1995</option>
              <option value="1996">1996</option>
              <option value="1997">1997</option>
              <option value="1998">1998</option>
              <option value="1999">1999</option>
              <option value="2000">2000</option>
              <option value="2001">2001</option>
              <option value="2002">2002</option>
              <option value="2003">2003</option>
              <option value="2004">2004</option>
              <option value="2005">2005</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>Jenis Kelamin</td>
          <td>:</td>
          <td>
            <input type="radio" name="jenis_kelamin" id="pria" value="Pria" checked>
            <label for="pria">Pria</label>
            <input type="radio" name="jenis_kelamin" id="wanita" value="Wanita">
            <label for="wanita">Wanita</label>
          </td>
        </tr>
        <tr>
          <td>Upload Foto</td>
          <td>:</td>
          <td><input type="file" name="foto"></td>
        </tr>
        <tr>
          <td>URL Website</td>
          <td>:</td>
          <td><input type="url" name="url_website" placeholder="URL Website Anda" size="48"></td>
        </tr>
        <tr>
          <td>Perguruan Tinggi</td>
          <td>:</td>
          <td><input type="text" name="perguruan_tinggi" size="25"></td>
        </tr>
      </table>
    </fieldset>

    <!-- Fieldset Info Akun -->
    <fieldset>
      <legend>Info Akun</legend>
      <table>
        <tr>
          <td>Email</td>
          <td>:</td>
          <td><input type="email" name="email" placeholder="Email Anda" size="25"></td>
        </tr>
        <tr>
          <td>Username</td>
          <td>:</td>
          <td><input type="text" name="username" placeholder="Username Anda" size="25"></td>
        </tr>
        <tr>
          <td>Password</td>
          <td>:</td>
          <td><input type="password" name="password" placeholder="Password Anda" size="25"></td>
        </tr>
        <tr>
          <td>Ulangi Password</td>
          <td>:</td>
          <td><input type="password" name="ulangi_password" placeholder="Password Anda" size="25"></td>
        </tr>
      </table>
    </fieldset>

    <!-- Fieldset Kemampuan Dasar -->
    <fieldset>
      <legend>Kemampuan Dasar</legend>
      <input type="checkbox" name="kemampuan" id="html" value="HTML">
      <label for="html">HTML</label>

      <input type="checkbox" name="kemampuan" id="css" value="CSS">
      <label for="css">CSS</label>

      <input type="checkbox" name="kemampuan" id="javascript" value="Javascript">
      <label for="javascript">Javascript</label>

      <input type="checkbox" name="kemampuan" id="php" value="PHP">
      <label for="php">PHP</label>

      <input type="checkbox" name="kemampuan" id="mysql" value="MySQL">
      <label for="mysql">MySQL</label>

      <input type="checkbox" name="kemampuan" id="laravel" value="Laravel">
      <label for="laravel">Laravel</label>

      <input type="checkbox" name="kemampuan" id="reactnative" value="React Native">
      <label for="reactnative">React Native</label>
    </fieldset>

    <!-- Tombol Aksi -->
    <div class="btn-group">
      <input type="reset" value="Reset">
      <input type="submit" value="Simpan">
      <input type="button" value="Button">
    </div>
  </form>

</body>
</html>
